name: Build QuickChatWidget APK
on:
  push:
    branches:
      - tmp-quickchatwidget-build
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuickChatWidgetBuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickChatWidget-debug
          path: QuickChatWidgetBuild/app/build/outputs/apk/debug/app-debug.apk
